<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miracle">
<link rel="manifest" href="manifest.json?v3">
<link rel="apple-touch-icon" href="icon-192.png?v3">
<link rel="icon" type="image/png" href="icon-192.png?v3">
<title>Miracle</title>
<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#333;
  --text-mid:#999;
  --text-light:#ccc;
  --line:#f5f5f5;
  --accent:#7ea8a2;
  --accent2:#9eb5c4;
  --accent3:#d4b896;
  --gradient:linear-gradient(135deg,#e8ede5 0%,#e8e0d5 50%,#e0e8ec 100%);
  --glass:rgba(255,255,255,0.72);
  --glass-border:rgba(255,255,255,0.9);
  --shadow:0 1px 3px rgba(0,0,0,0.03);
  --shadow-md:0 4px 20px rgba(0,0,0,0.06);
  --radius:16px;
  --serif:'Georgia','Songti SC',serif;
  --sans:-apple-system,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  --safe:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  position:fixed;width:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font-family:inherit;}

#app{height:100%;display:flex;flex-direction:column;position:relative;}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:110px;}
.page.active{display:block;}

/* ===== 标题 ===== */
.app-header{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 8px;}
.app-header h1{
  font-family:var(--serif);font-size:1.6rem;font-weight:400;
  letter-spacing:6px;
  background:linear-gradient(135deg,#7ea8a2,#9eb5c4,#d4b896);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.app-header .sub{font-size:0.62rem;color:var(--text-light);letter-spacing:4px;margin-top:4px;font-weight:300;}

/* ===== 书列表 ===== */
.book-list{max-width:680px;margin:0 auto;padding:8px 16px;}
.book-row{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
  cursor:pointer;transition:all 0.25s;
  border:1px solid rgba(0,0,0,0.02);
}
.book-row:active{transform:scale(0.98);}
.book-row:hover{box-shadow:var(--shadow-md);}
.book-row .cover{
  width:52px;height:70px;border-radius:4px 8px 8px 4px;object-fit:cover;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.1),inset 3px 0 0 rgba(0,0,0,0.06);
}
.book-row .cover-ph{
  width:52px;height:70px;border-radius:4px 8px 8px 4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:0.55rem;color:rgba(255,255,255,0.9);
  text-align:center;padding:4px;word-break:break-all;line-height:1.3;
  box-shadow:0 2px 8px rgba(0,0,0,0.1),inset 3px 0 0 rgba(0,0,0,0.06);
}
.book-row .info{flex:1;min-width:0;}
.book-row .b-title{font-size:0.9rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.book-row .b-meta{font-size:0.7rem;color:var(--text-mid);margin-top:3px;}
.book-row .b-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.book-row .tag{font-size:0.62rem;color:var(--text-mid);background:var(--line);border-radius:6px;padding:2px 7px;}
.book-row .arrow{color:var(--text-light);font-size:1.05rem;flex-shrink:0;}

/* ===== 统计 ===== */
.stats-wrap{max-width:680px;margin:0 auto;padding:16px;}
.stat-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.stat-box{
  background:var(--card);border-radius:var(--radius);padding:22px;text-align:center;
  box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.02);
  position:relative;overflow:hidden;
}
.stat-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--gradient);
}
.stat-box .num{font-family:var(--serif);font-size:1.9rem;font-weight:400;color:var(--text);}
.stat-box .lbl{font-size:0.68rem;color:var(--text-light);letter-spacing:2px;margin-top:4px;}

.chart-card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px;
  border:1px solid rgba(0,0,0,0.02);
}
.chart-card h3{font-size:0.82rem;font-weight:500;margin-bottom:14px;letter-spacing:2px;color:var(--text);}

/* 条形图 */
.genre-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.genre-bar .gname{font-size:0.74rem;width:60px;flex-shrink:0;color:var(--text-mid);}
.genre-bar .gtrack{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
.genre-bar .gfill{height:100%;border-radius:4px;transition:width 0.6s;}
.genre-bar .gcount{font-size:0.7rem;color:var(--text-light);width:28px;text-align:right;}

/* 饼图 */
.pie-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;}
.pie-legend{display:flex;flex-direction:column;gap:7px;}
.pie-legend-item{display:flex;align-items:center;gap:7px;font-size:0.7rem;color:var(--text-mid);}
.pie-legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

/* 柱状图 */
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:130px;padding:0 4px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.bar-col .bar{width:100%;max-width:30px;border-radius:6px 6px 0 0;transition:height 0.6s;min-height:3px;}
.bar-col .bar-count{font-size:0.58rem;color:var(--text-light);}
.bar-col .bar-label{font-size:0.55rem;color:var(--text-mid);writing-mode:vertical-rl;letter-spacing:1px;margin-top:2px;max-height:50px;overflow:hidden;text-orientation:upright;}

/* 月度趋势 */
.trend-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:90px;}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.trend-col .tbar{width:100%;max-width:18px;border-radius:4px 4px 0 0;min-height:2px;transition:height 0.6s;opacity:0.65;}
.trend-col .tbar.active{opacity:1;}
.trend-col .tmon{font-size:0.52rem;color:var(--text-light);}

/* ===== 书详情 ===== */
.book-detail-header{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 8px;}
.book-detail-header .back{font-size:1.3rem;color:var(--text-mid);padding:4px 8px;}
.book-detail-header .title{flex:1;text-align:center;font-family:var(--serif);font-size:1.05rem;font-weight:400;letter-spacing:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:34px;}

.add-btn-wrap{text-align:center;padding:4px 20px 16px;}
.btn-add{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;padding:9px 28px;border-radius:22px;
  font-size:0.8rem;letter-spacing:2px;border:none;cursor:pointer;
  box-shadow:0 2px 10px rgba(126,168,162,0.3);
  transition:all 0.25s;
}
.btn-add:active{transform:scale(0.96);}

/* 笔记网格 */
.notes-grid{max-width:680px;margin:0 auto;padding:4px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.note-mini{
  background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);cursor:pointer;
  transition:all 0.25s;border:1px solid rgba(0,0,0,0.02);
}
.note-mini:active{transform:scale(0.97);}
.note-mini .nm-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.note-mini .nm-img-ph{
  width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:0.8rem;color:var(--text-light);
  background:var(--gradient);padding:12px;text-align:center;
}
.note-mini .nm-body{padding:10px 12px;}
.note-mini .nm-quote{font-family:var(--serif);font-size:0.76rem;line-height:1.5;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.note-mini .nm-date{font-size:0.62rem;color:var(--text-light);margin-top:6px;letter-spacing:1px;}

/* ===== 拍立得 ===== */
.note-detail-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:24px;}
.note-detail-overlay.active{display:flex;}
.polaroid{
  background:#fff;border-radius:4px;padding:16px 16px 20px;
  max-width:360px;width:100%;
  box-shadow:0 10px 50px rgba(0,0,0,0.2);
  animation:pIn 0.35s ease;transform:rotate(-2deg);
}
@keyframes pIn{from{opacity:0;transform:scale(0.9) rotate(-4deg);}to{opacity:1;transform:scale(1) rotate(-2deg);}}
.polaroid img{width:100%;border-radius:2px;display:block;max-height:380px;object-fit:cover;}
.polaroid .p-quote{font-family:var(--serif);font-size:0.88rem;line-height:1.7;color:var(--text);margin-top:12px;padding:0 4px;}
.polaroid .p-card{
  background:linear-gradient(135deg,#f8faf8,#f5f8fa);border-radius:10px;
  padding:12px 14px;margin-top:10px;border:1px solid rgba(0,0,0,0.03);
}
.polaroid .p-card .lbl{font-size:0.62rem;color:var(--text-light);letter-spacing:2px;margin-bottom:6px;}
.polaroid .p-card .txt{font-family:var(--serif);font-size:0.82rem;line-height:1.7;color:var(--text-mid);white-space:pre-wrap;word-break:break-word;}
.polaroid .p-date{font-family:var(--serif);font-size:0.68rem;color:var(--text-light);text-align:center;margin-top:12px;letter-spacing:3px;}
.polaroid .p-actions{display:flex;gap:10px;margin-top:14px;justify-content:center;}
.polaroid .p-actions button{font-size:0.74rem;padding:6px 16px;border-radius:16px;letter-spacing:1px;}
.polaroid .btn-del{color:#a08080;background:#f8f4f4;}
.polaroid .btn-close{color:var(--text-mid);background:var(--line);}

/* ===== 程序坞 ===== */
.dock{
  position:fixed;bottom:calc(var(--safe) + 10px);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:0.5px solid var(--glass-border);
  border-radius:30px;padding:7px 8px;
  box-shadow:0 4px 24px rgba(0,0,0,0.06),inset 0 1px 1px rgba(255,255,255,0.8);
  z-index:100;
}
.dock-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px;border-radius:22px;transition:all 0.25s;position:relative;}
.dock-item:active{transform:scale(0.92);}
.dock-item.active{background:rgba(255,255,255,0.6);}
.dock-item.active .dock-label{color:var(--accent);}
.dock-icon{font-size:1.25rem;line-height:1;}
.dock-label{font-size:0.56rem;color:var(--text-mid);letter-spacing:1px;transition:color 0.25s;}

/* ===== 弹窗 ===== */
.modal-overlay{display:none;position:fixed;inset:0;z-index:800;background:rgba(50,50,50,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--card);border-radius:20px;padding:28px 22px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;animation:mIn 0.3s ease;}
@keyframes mIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:none;}}
.modal h2{font-family:var(--serif);font-size:1.1rem;font-weight:400;text-align:center;letter-spacing:3px;margin-bottom:18px;color:var(--text);}
.modal label{display:block;font-size:0.72rem;color:var(--text-mid);margin:14px 0 6px;letter-spacing:1px;}
.modal input[type="text"],.modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:0.84rem;color:var(--text);background:#fafafa;transition:all 0.2s;}
.modal input[type="text"]:focus,.modal textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(126,168,162,0.08);}
.modal textarea{resize:vertical;}
.modal textarea.quote-input{min-height:62px;font-family:var(--serif);line-height:1.7;}
.modal textarea.thoughts-input{min-height:76px;font-family:var(--serif);line-height:28px;background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 27px,var(--line) 28px);background-attachment:local;}

.color-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.color-opt{width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all 0.2s;}
.color-opt.selected{border-color:var(--text);transform:scale(1.1);}
.color-custom-wrap{width:30px;height:30px;border-radius:50%;border:2px dashed var(--text-light);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;}
.color-custom-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.color-custom-wrap .plus{font-size:0.8rem;color:var(--text-light);}

.img-upload{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all 0.2s;}
.img-upload:hover{border-color:var(--accent);background:rgba(126,168,162,0.02);}
.img-upload .icon{font-size:1.4rem;}
.img-upload p{font-size:0.7rem;color:var(--text-mid);margin-top:3px;}
.img-preview{max-width:100%;max-height:160px;border-radius:10px;margin-top:8px;display:none;}
.img-preview.show{display:block;}

.modal-actions{display:flex;gap:10px;margin-top:22px;}
.btn-save{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:11px;border-radius:10px;font-size:0.84rem;letter-spacing:1px;border:none;box-shadow:0 2px 10px rgba(126,168,162,0.25);}
.btn-cancel{flex:1;background:none;color:var(--text-mid);border:1px solid var(--line);padding:11px;border-radius:10px;font-size:0.84rem;}

.empty{text-align:center;padding:80px 20px;color:var(--text-light);}
.empty .icon{font-size:2.5rem;margin-bottom:10px;}
.empty p{font-size:0.8rem;letter-spacing:1px;}

@media(max-width:380px){.notes-grid{gap:10px;}.book-row .cover,.book-row .cover-ph{width:46px;height:62px;}}
/* 长按菜单 */
.press-menu{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px;}
.press-menu.active{display:flex;}
.press-menu-card{background:#fff;border-radius:16px;padding:8px;width:200px;box-shadow:0 8px 32px rgba(0,0,0,0.15);animation:mIn 0.25s ease;}
.press-menu-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:10px;cursor:pointer;font-size:0.88rem;color:var(--text);transition:background 0.2s;}
.press-menu-item:hover{background:var(--line);}
.press-menu-item.danger{color:#c08080;}
.press-menu-item.danger:hover{background:#fdf6f6;}
.press-menu-divider{height:1px;background:var(--line);margin:2px 0;}

/* 抠图处理中提示 */
.cutout-loading{display:none;text-align:center;padding:16px;font-size:0.82rem;color:var(--text-mid);}
.cutout-loading.show{display:block;}
.cutout-loading .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

@media print{.dock,.modal-overlay,.note-detail-overlay,.press-menu{display:none!important;}}
</style>
</head>
<body>
<div id="app">

<!-- 主页 -->
<div class="page active" id="pageHome">
  <div class="app-header">
    <h1>Miracle</h1>
    <div class="sub">R E A D I N G &nbsp; J O U R N A L</div>
  </div>
  <div class="add-btn-wrap">
    <button class="btn-add" onclick="openBookModal()">+ 添加书</button>
  </div>
  <div class="book-list" id="bookList"></div>
  <div id="emptyHome" class="empty" style="display:none;"><div class="icon">📚</div><p>书架空空的，添加一本开始吧</p></div>
</div>

<!-- 统计 -->
<div class="page" id="pageStats">
  <div class="app-header">
    <h1>统计</h1>
    <div class="sub">S T A T I S T I C S</div>
  </div>
  <div class="stats-wrap" id="statsWrap"></div>
</div>

<!-- 书详情 -->
<div class="page" id="pageBook">
  <div class="book-detail-header">
    <button class="back" onclick="goHome()">‹</button>
    <div class="title" id="bookTitle"></div>
  </div>
  <div class="add-btn-wrap"><button class="btn-add" onclick="openNoteModal()">+ 添加摘录</button></div>
  <div id="emptyNotes" class="empty" style="display:none;"><div class="icon">📖</div><p>还没有摘录，开始记录吧</p></div>
  <div class="notes-grid" id="notesGrid"></div>
</div>

</div>

<!-- 程序坞 -->
<div class="dock" id="dock">
  <div class="dock-item active" onclick="switchTab('home')" id="dockHome"><div class="dock-icon">🏡</div><div class="dock-label">主页</div></div>
  <div class="dock-item" onclick="switchTab('stats')" id="dockStats"><div class="dock-icon">📊</div><div class="dock-label">统计</div></div>
</div>

<!-- 添加书弹窗 -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h2>添加书</h2>
    <label>书名</label><input type="text" id="inputTitle" placeholder="书名">
    <label>作者</label><input type="text" id="inputAuthor" placeholder="作者（可选）">
    <label>标签（逗号分隔）</label><input type="text" id="inputTags" placeholder="如：小说, 青春">
    <label>封面颜色</label>
    <div class="color-grid" id="colorGrid">
      <div class="color-opt selected" style="background:#7ea8a2" data-c="#7ea8a2"></div>
      <div class="color-opt" style="background:#9eb5c4" data-c="#9eb5c4"></div>
      <div class="color-opt" style="background:#d4b896" data-c="#d4b896"></div>
      <div class="color-opt" style="background:#c4d4a8" data-c="#c4d4a8"></div>
      <div class="color-opt" style="background:#c0a8a0" data-c="#c0a8a0"></div>
      <div class="color-opt" style="background:#e8c4c4" data-c="#e8c4c4"></div>
      <div class="color-opt" style="background:#7ea8a2" data-c="#7ea8a2"></div>
      <div class="color-opt" style="background:#d4b896" data-c="#d4b896"></div>
      <div class="color-opt" style="background:#1a1a1a" data-c="#1a1a1a"></div>
      <div class="color-opt" style="background:#e8645a" data-c="#e8645a"></div>
      <div class="color-opt" style="background:#5a8ae8" data-c="#5a8ae8"></div>
      <div class="color-opt" style="background:#f0c030" data-c="#f0c030"></div>
      <label class="color-custom-wrap"><span class="plus">+</span><input type="color" id="customColor" value="#888888"></label>
    </div>
    <label>封面图片（可选）</label>
    <div class="img-upload" onclick="document.getElementById('coverInput').click()"><div class="icon">📁</div><p>点击选择封面</p></div>
    <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCover(event)">
    <img class="img-preview" id="coverPrev">
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('bookModal')">取消</button><button class="btn-save" onclick="saveBook()">保存</button></div>
  </div>
</div>

<!-- 添加笔记弹窗 -->
<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <h2>添加摘录</h2>
    <label>摘录图片</label>
    <div class="img-upload" onclick="document.getElementById('noteImgInput').click()"><div class="icon">📁</div><p>点击选择图片</p></div>
    <input type="file" id="noteImgInput" accept="image/*" style="display:none" onchange="handleNoteImg(event)">
    <img class="img-preview" id="noteImgPrev">
    <label>摘录的句子</label><textarea class="quote-input" id="inputQuote" placeholder="好句子..."></textarea>
    <label>感悟</label><textarea class="thoughts-input" id="inputThoughts" placeholder="你的想法..."></textarea>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('noteModal')">取消</button><button class="btn-save" onclick="saveNote()">保存</button></div>
  </div>
</div>

<!-- 拍立得 -->
<div class="note-detail-overlay" id="noteDetail"><div class="polaroid" id="polaroidCard"></div></div>

<!-- 长按菜单 -->
<div class="press-menu" id="pressMenu">
  <div class="press-menu-card">
    <div class="press-menu-item" onclick="editBook()">✏️ 修改信息</div>
    <div class="press-menu-divider"></div>
    <div class="press-menu-item danger" onclick="confirmDeleteBook()">🗑 删除</div>
    <div class="press-menu-divider"></div>
    <div class="press-menu-item" onclick="closePressMenu()" style="justify-content:center;color:var(--text-mid);">取消</div>
  </div>
</div>

<script>
const KEY='miracle_data_v3';
let data=JSON.parse(localStorage.getItem(KEY)||'{"books":[]}');
let currentBookId=null,selColor='#7ea8a2',coverImg=null,noteImg=null;

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function fmtDate(d){const dt=new Date(d);return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;}

function guessGenre(tags,title){
  const t=((tags||[]).join('')+title).toLowerCase();
  const rules=[[['悬疑','推理','犯罪','侦探','thriller','mystery'],'悬疑'],[['奇幻','魔幻','科幻','fantasy','sci-fi'],'奇幻'],[['青春','校园','成长'],'青春'],[['散文','随笔','essay'],'散文'],[['历史','history'],'历史'],[['科学','科普','science'],'科学'],[['心理','psychology'],'心理'],[['传记','回忆录','biography'],'传记'],[['诗歌','诗','poetry'],'诗歌'],[['女性','言情','爱情','romance'],'小说'],[['小说','fiction','novel'],'小说']];
  for(const[kw,g]of rules){if(kw.some(w=>t.includes(w)))return g;}
  return '其他';
}
function getGenres(){const c={};data.books.forEach(b=>{const g=b.genre||guessGenre(b.tags||[],b.title);c[g]=(c[g]||0)+1;});return c;}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.dock-item').forEach(d=>d.classList.remove('active'));
  document.getElementById('pageBook').classList.remove('active');
  if(tab==='home'){document.getElementById('pageHome').classList.add('active');document.getElementById('dockHome').classList.add('active');renderHome();}
  else if(tab==='stats'){document.getElementById('pageStats').classList.add('active');document.getElementById('dockStats').classList.add('active');renderStats();}
}
function goHome(){switchTab('home');}

function renderHome(){
  const list=document.getElementById('bookList'),empty=document.getElementById('emptyHome');
  if(data.books.length===0){empty.style.display='block';list.innerHTML='';return;}
  empty.style.display='none';
  list.innerHTML=data.books.map(b=>{
    const tags=(b.tags||[]).slice(0,3);
    return `<div class="book-row" data-book-id="${b.id}" onclick="openBook('${b.id}')">
      ${b.coverImg?`<img class="cover" src="${b.coverImg}">`:`<div class="cover-ph" style="background:${b.color||'#7ea8a2'}">${esc(b.title)}</div>`}
      <div class="info">
        <div class="b-title">《${esc(b.title)}》</div>
        <div class="b-meta">${(b.notes||[]).length} 条笔记${b.author?' · '+esc(b.author):''}</div>
        ${tags.length?`<div class="b-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      </div><div class="arrow">›</div></div>`;
  }).join('');
  // 绑定长按
  list.querySelectorAll('.book-row').forEach(row=>{
    let pressTimer=null;
    row.addEventListener('touchstart',function(e){
      const bid=this.dataset.bookId;
      pressTimer=setTimeout(()=>{e.preventDefault();showPressMenu(bid);},500);
    });
    row.addEventListener('touchend',()=>clearTimeout(pressTimer));
    row.addEventListener('touchmove',()=>clearTimeout(pressTimer));
    row.addEventListener('mousedown',function(e){
      if(e.button!==0)return;
      const bid=this.dataset.bookId;
      pressTimer=setTimeout(()=>showPressMenu(bid),600);
    });
    row.addEventListener('mouseup',()=>clearTimeout(pressTimer));
    row.addEventListener('mouseleave',()=>clearTimeout(pressTimer));
    row.addEventListener('contextmenu',function(e){e.preventDefault();showPressMenu(this.dataset.bookId);});
  });
}

// 长按菜单
let pressBookId=null;
function showPressMenu(bid){pressBookId=bid;document.getElementById('pressMenu').classList.add('active');}
function closePressMenu(){document.getElementById('pressMenu').classList.remove('active');pressBookId=null;}
document.getElementById('pressMenu').addEventListener('click',function(e){if(e.target===this)closePressMenu();});

function confirmDeleteBook(){
  if(!pressBookId)return;
  const b=data.books.find(x=>x.id===pressBookId);
  if(!b)return;
  if(!confirm(`确认删除《${b.title}》及其所有摘录吗？`))return;
  data.books=data.books.filter(x=>x.id!==pressBookId);
  save();closePressMenu();renderHome();
}

function editBook(){
  if(!pressBookId)return;
  const b=data.books.find(x=>x.id===pressBookId);
  if(!b)return;
  closePressMenu();
  // 复用添加书弹窗，改为编辑模式
  document.getElementById('bookModal').classList.add('active');
  document.getElementById('inputTitle').value=b.title||'';
  document.getElementById('inputAuthor').value=b.author||'';
  document.getElementById('inputTags').value=(b.tags||[]).join(', ');
  selColor=b.color||'#7ea8a2';
  coverImg=b.coverImg||null;
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  const co=document.querySelector(`.color-opt[data-c="${selColor}"]`);if(co)co.classList.add('selected');
  if(coverImg){const p=document.getElementById('coverPrev');p.src=coverImg;p.classList.add('show');}
  else{document.getElementById('coverPrev').classList.remove('show');}
  // 标记为编辑模式
  document.getElementById('bookModal').dataset.editId=pressBookId;
  document.querySelector('#bookModal h2').textContent='修改书';
}

function renderStats(){
  const wrap=document.getElementById('statsWrap');
  const totalBooks=data.books.length;
  const totalNotes=data.books.reduce((s,b)=>s+(b.notes||[]).length,0);
  const totalImg=data.books.reduce((s,b)=>s+(b.notes||[]).filter(n=>n.image).length,0);
  const genres=getGenres();
  const sorted=Object.entries(genres).sort((a,b)=>b[1]-a[1]);
  const maxCount=Math.max(...sorted.map(x=>x[1]),1);
  const palette=['#7ea8a2','#9eb5c4','#d4b896','#c4d4a8','#c0a8a0','#e8c4c4','#7ea8a2','#b0a0b8','#a8d8e0','#e0a8c8','#c0c0e0','#bbb'];

  // 饼图
  const pieData=sorted.map(([g,c],i)=>({name:g,value:c,color:palette[i%palette.length]}));
  const pieTotal=pieData.reduce((s,d)=>s+d.value,0);
  let acc=0;const pcx=70,pcy=70,pr=60;
  const slices=pieTotal>0?pieData.map(d=>{
    const sa=(acc/pieTotal)*Math.PI*2-Math.PI/2;acc+=d.value;
    const ea=(acc/pieTotal)*Math.PI*2-Math.PI/2;
    const x1=pcx+pr*Math.cos(sa),y1=pcy+pr*Math.sin(sa);
    const x2=pcx+pr*Math.cos(ea),y2=pcy+pr*Math.sin(ea);
    const la=(ea-sa)>Math.PI?1:0;
    return pieTotal===1?`<circle cx="${pcx}" cy="${pcy}" r="${pr}" fill="${d.color}"/>`:`<path d="M${pcx},${pcy} L${x1},${y1} A${pr},${pr} 0 ${la} 1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;
  }).join(''):'';

  // 柱状图
  const bookStats=data.books.map(b=>({title:b.title,count:(b.notes||[]).length,color:b.color||'#7ea8a2'})).sort((a,b)=>b.count-a.count).slice(0,8);
  const maxBar=Math.max(...bookStats.map(b=>b.count),1);

  // 月度趋势
  const now=new Date();const months=[];
  for(let i=5;i>=0;i--){const dt=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:dt.getFullYear()+'-'+dt.getMonth(),label:(dt.getMonth()+1)+'月'});}
  const mc=months.map(m=>{let c=0;data.books.forEach(b=>(b.notes||[]).forEach(n=>{const nd=new Date(n.date);if(nd.getFullYear()+'-'+nd.getMonth()===m.key)c++;}));return c;});
  const maxM=Math.max(...mc,1);

  wrap.innerHTML=`
    <div class="stat-overview">
      <div class="stat-box"><div class="num">${totalBooks}</div><div class="lbl">读过 / 本</div></div>
      <div class="stat-box"><div class="num">${totalNotes}</div><div class="lbl">摘录 / 条</div></div>
      <div class="stat-box"><div class="num">${totalImg}</div><div class="lbl">图片 / 张</div></div>
      <div class="stat-box"><div class="num">${sorted.length}</div><div class="lbl">类型 / 种</div></div>
    </div>
    ${pieTotal>0?`
    <div class="chart-card">
      <h3>🥧 类型占比</h3>
      <div class="pie-wrap">
        <svg viewBox="0 0 140 140" style="width:130px;height:130px;">${slices}<circle cx="70" cy="70" r="26" fill="#fff"/><text x="70" y="67" text-anchor="middle" font-size="10" fill="#999" font-family="Georgia">${pieTotal}</text><text x="70" y="78" text-anchor="middle" font-size="6" fill="#ccc" letter-spacing="1">BOOKS</text></svg>
        <div class="pie-legend">${pieData.map(d=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${d.color}"></div>${d.name} ${d.value}本 (${Math.round(d.value/pieTotal*100)}%)</div>`).join('')}</div>
      </div>
    </div>`:''}
    ${sorted.length>0?`
    <div class="chart-card">
      <h3>📊 类型分布</h3>
      ${sorted.map(([g,c],i)=>`<div class="genre-bar"><div class="gname">${g}</div><div class="gtrack"><div class="gfill" style="width:${c/maxCount*100}%;background:${palette[i%palette.length]}"></div></div><div class="gcount">${c}</div></div>`).join('')}
    </div>`:''}
    ${bookStats.length>0?`
    <div class="chart-card">
      <h3>📖 各书摘录数</h3>
      <div class="bar-chart">${bookStats.map(b=>`<div class="bar-col"><div class="bar-count">${b.count}</div><div class="bar" style="height:${b.count/maxBar*95}px;background:linear-gradient(180deg,${b.color},${b.color}cc);"></div><div class="bar-label">${esc(b.title.length>4?b.title.slice(0,4):b.title)}</div></div>`).join('')}</div>
    </div>`:''}
    <div class="chart-card">
      <h3>📅 近 6 个月趋势</h3>
      <div class="trend-bars">${months.map((m,i)=>`<div class="trend-col"><div class="tbar ${mc[i]>0?'active':''}" style="height:${mc[i]/maxM*75}px;background:linear-gradient(180deg,#7ea8a2,#9eb5c4);"></div><div class="tmon">${m.label}</div></div>`).join('')}</div>
    </div>
    ${totalBooks===0?'<div class="empty" style="padding:40px;"><div class="icon">📊</div><p>还没有数据</p></div>':''}
  `;
}

function openBook(id){
  currentBookId=id;const b=data.books.find(x=>x.id===id);if(!b)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pageBook').classList.add('active');
  document.getElementById('bookTitle').textContent=b.title;
  renderNotes(b);window.scrollTo(0,0);
}
function renderNotes(b){
  const grid=document.getElementById('notesGrid'),empty=document.getElementById('emptyNotes');
  const notes=b.notes||[];
  if(notes.length===0){empty.style.display='block';grid.innerHTML='';return;}
  empty.style.display='none';
  grid.innerHTML=notes.map((n,i)=>`<div class="note-mini" onclick="showNote('${b.id}',${i})">
    ${n.image?`<img class="nm-img" src="${n.image}">`:`<div class="nm-img-ph">${esc((n.quote||'...').slice(0,20))}</div>`}
    <div class="nm-body"><div class="nm-quote">${esc(n.quote||'')}</div><div class="nm-date">${fmtDate(n.date)}</div></div></div>`).join('');
}

function showNote(bid,idx){
  const b=data.books.find(x=>x.id===bid);if(!b||!b.notes[idx])return;
  const n=b.notes[idx];
  document.getElementById('polaroidCard').innerHTML=`
    ${n.image?`<img src="${n.image}">`:''}
    ${n.quote?`<div class="p-quote">"${esc(n.quote)}"</div>`:''}
    ${n.thoughts?`<div class="p-card"><div class="lbl">✍ 感悟</div><div class="txt">${esc(n.thoughts)}</div></div>`:''}
    <div class="p-date">${fmtDate(n.date)}</div>
    <div class="p-actions"><button class="btn-del" onclick="delNote('${bid}',${idx})">删除</button><button class="btn-close" onclick="closeNote()">关闭</button></div>`;
  document.getElementById('noteDetail').classList.add('active');
}
function closeNote(){document.getElementById('noteDetail').classList.remove('active');}
document.getElementById('noteDetail').addEventListener('click',function(e){if(e.target===this)closeNote();});
function delNote(bid,idx){if(!confirm('删除？'))return;const b=data.books.find(x=>x.id===bid);if(!b)return;b.notes.splice(idx,1);save();closeNote();renderNotes(b);renderHome();}

document.querySelectorAll('.color-opt[data-c]').forEach(el=>{
  el.addEventListener('click',()=>{document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');selColor=el.dataset.c;});
});
document.getElementById('customColor').addEventListener('input',function(){
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  selColor=this.value;this.parentElement.style.background=this.value;this.parentElement.style.borderStyle='solid';
  this.parentElement.querySelector('.plus').style.color='#fff';
});

function removeBackground(imgData){
  const c=document.createElement('canvas');
  let w=imgData.width,h=imgData.height;const mx=500;
  if(w>mx){h=Math.round(h*mx/w);w=mx;}
  c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  ctx.drawImage(imgData,0,0,w,h);
  const id=ctx.getImageData(0,0,w,h);
  const d=id.data;
  // 采样四角颜色作为背景参考
  const corners=[0,(w-1)*4,(h-1)*w*4,(h-1)*w*4+(w-1)*4];
  let br=0,bg=0,bb=0,bn=0;
  corners.forEach(ci=>{br+=d[ci];bg+=d[ci+1];bb+=d[ci+2];bn++;});
  br/=bn;bg/=bn;bb/=bn;
  const th=45;
  for(let i=0;i<d.length;i+=4){
    const diff=Math.sqrt((d[i]-br)**2+(d[i+1]-bg)**2+(d[i+2]-bb)**2);
    if(diff<th){d[i+3]=0;}
    else if(diff<th+30){d[i+3]=Math.round((diff-th)/30*255);}
  }
  ctx.putImageData(id,0,0);
  return c.toDataURL('image/png');
}

function handleCover(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      // 显示“抠图中”
      document.getElementById('coverPrev').classList.remove('show');
      const loading=document.createElement('div');
      loading.className='cutout-loading show';
      loading.id='cutoutLoading';
      loading.innerHTML='<span class="spinner"></span>正在抠图...';
      document.querySelector('#bookModal .img-upload').after(loading);
      // 异步处理
      setTimeout(()=>{
        coverImg=removeBackground(img);
        const p=document.getElementById('coverPrev');p.src=coverImg;p.classList.add('show');
        const cl=document.getElementById('cutoutLoading');if(cl)cl.remove();
      },100);
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}
function saveBook(){
  const title=document.getElementById('inputTitle').value.trim();if(!title){alert('请输入书名');return;}
  const author=document.getElementById('inputAuthor').value.trim();
  const tagsStr=document.getElementById('inputTags').value.trim();
  const tags=tagsStr?tagsStr.split(/[,，、]/).map(t=>t.trim()).filter(Boolean):[];
  const editId=document.getElementById('bookModal').dataset.editId;
  if(editId){
    // 编辑模式
    const b=data.books.find(x=>x.id===editId);if(b){
      b.title=title;b.author=author;b.tags=tags;b.color=selColor;b.coverImg=coverImg;b.genre=guessGenre(tags,title);
    }
  }else{
    data.books.unshift({id:'b_'+Date.now(),title,author,tags,color:selColor,coverImg,genre:guessGenre(tags,title),notes:[]});
  }
  save();closeModal('bookModal');renderHome();
}
function handleNoteImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const mx=1200;if(w>mx){h=h*mx/w;w=mx;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);noteImg=c.toDataURL('image/jpeg',0.85);const p=document.getElementById('noteImgPrev');p.src=noteImg;p.classList.add('show');};img.src=ev.target.result;};r.readAsDataURL(f);}
function saveNote(){
  const quote=document.getElementById('inputQuote').value.trim(),thoughts=document.getElementById('inputThoughts').value.trim();
  if(!quote&&!thoughts&&!noteImg){alert('至少写点什么');return;}
  const b=data.books.find(x=>x.id===currentBookId);if(!b)return;
  b.notes=b.notes||[];b.notes.unshift({image:noteImg,quote,thoughts,date:new Date().toISOString()});
  save();closeModal('noteModal');renderNotes(b);renderHome();
}

function openBookModal(){
  document.getElementById('bookModal').classList.add('active');
  delete document.getElementById('bookModal').dataset.editId;
  document.querySelector('#bookModal h2').textContent='添加书';
  document.getElementById('inputTitle').value='';
  document.getElementById('inputAuthor').value='';
  document.getElementById('inputTags').value='';
  document.getElementById('coverInput').value='';
  document.getElementById('coverPrev').classList.remove('show');
  document.getElementById('coverPrev').src='';
  coverImg=null;selColor='#7ea8a2';
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  const first=document.querySelector('.color-opt[data-c="#7ea8a2"]');if(first)first.classList.add('selected');
}
function openNoteModal(){
  document.getElementById('noteModal').classList.add('active');
  document.getElementById('noteImgInput').value='';
  document.getElementById('noteImgPrev').classList.remove('show');
  document.getElementById('noteImgPrev').src='';
  document.getElementById('inputQuote').value='';
  document.getElementById('inputThoughts').value='';
  noteImg=null;
}
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});});

let ec=0;
document.querySelector('#pageHome .app-header h1').addEventListener('click',()=>{ec++;if(ec>=3){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Miracle_'+new Date().toISOString().slice(0,10)+'.json';a.click();ec=0;}});

// 强制清除旧 SW 缓存
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
    navigator.serviceWorker.register('sw.js?v3').catch(()=>{});
  });
}
renderHome();
</script>
</body>
