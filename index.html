<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 阅读拾遗</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffaf3;
    --accent: #c9974a;
    --accent-light: #e8d5b8;
    --text: #4a3f35;
    --text-light: #8b7d6b;
    --line: #d4c5a9;
    --shadow: 0 2px 12px rgba(139, 111, 71, 0.12);
    --font-serif: 'Georgia', 'Songti SC', 'STSong', serif;
    --font-sans: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(201, 151, 74, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(201, 151, 74, 0.04) 0%, transparent 50%);
  }

  /* ===== 顶部标题区 ===== */
  header {
    text-align: center;
    padding: 48px 20px 32px;
  }
  header h1 {
    font-family: var(--font-serif);
    font-size: 2.4rem;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 2px;
  }
  header h1 span { color: var(--accent); }
  header p {
    margin-top: 8px;
    font-size: 0.95rem;
    color: var(--text-light);
    letter-spacing: 1px;
  }

  /* ===== 添加按钮 ===== */
  .add-bar {
    text-align: center;
    margin-bottom: 32px;
  }
  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 28px;
    font-size: 1rem;
    font-family: var(--font-sans);
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(201, 151, 74, 0.35);
    transition: all 0.3s ease;
    letter-spacing: 1px;
  }
  .btn-add:hover {
    background: #b88638;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(201, 151, 74, 0.45);
  }
  .btn-add:active { transform: translateY(0); }

  /* ===== 卡片网格 ===== */
  .cards-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
  }

  /* ===== 单张卡片 ===== */
  .card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 24px rgba(139, 111, 71, 0.18);
  }

  .card-img-wrap {
    width: 100%;
    overflow: hidden;
    background: var(--accent-light);
    position: relative;
  }
  .card-img-wrap img {
    width: 100%;
    display: block;
    max-height: 500px;
    object-fit: cover;
  }
  .card-img-wrap .img-placeholder {
    width: 100%;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--accent);
    background: linear-gradient(135deg, var(--accent-light) 0%, #f0e0cc 100%);
  }

  .card-quote {
    padding: 16px 20px 8px;
  }
  .card-quote p {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--text);
    text-align: justify;
  }
  .card-quote .quote-mark {
    font-size: 1.6rem;
    color: var(--accent);
    margin-right: 4px;
    font-family: Georgia, serif;
  }

  /* 感悟横线区 */
  .card-thoughts {
    padding: 12px 20px 20px;
  }
  .card-thoughts label {
    font-size: 0.8rem;
    color: var(--text-light);
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: block;
  }
  .card-thoughts .lines {
    background-image: repeating-linear-gradient(
      transparent,
      transparent 31px,
      var(--line) 31px,
      var(--line) 32px
    );
    min-height: 96px;
    padding: 4px 0;
  }
  .card-thoughts .thoughts-text {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    line-height: 32px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 96px;
  }

  .card-date {
    padding: 0 20px 12px;
    font-size: 0.75rem;
    color: var(--text-light);
    text-align: right;
  }

  .card-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover .card-delete { opacity: 1; }
  .card-delete:hover { background: rgba(220, 80, 80, 0.7); }

  /* ===== 空状态 ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1rem; }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(74, 63, 53, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal h2 {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    color: var(--text);
    margin-bottom: 20px;
    text-align: center;
  }

  .modal label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 6px;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }

  .modal textarea,
  .modal input[type="text"] {
    width: 100%;
    border: 1.5px solid var(--accent-light);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    color: var(--text);
    background: #fff;
    resize: vertical;
    transition: border-color 0.3s;
  }
  .modal textarea:focus,
  .modal input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .modal textarea.quote-input {
    min-height: 80px;
    font-family: var(--font-serif);
    font-size: 1rem;
    line-height: 1.7;
  }
  .modal textarea.thoughts-input {
    min-height: 96px;
    font-family: var(--font-serif);
    line-height: 32px;
    background-image: repeating-linear-gradient(
      transparent,
      transparent 31px,
      var(--line) 31px,
      var(--line) 32px
    );
    background-attachment: local;
    line-height: 32px;
  }

  /* 图片上传区 */
  .img-upload-area {
    border: 2px dashed var(--accent-light);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s, background 0.3s;
    margin-bottom: 4px;
  }
  .img-upload-area:hover {
    border-color: var(--accent);
    background: rgba(201, 151, 74, 0.04);
  }
  .img-upload-area .upload-icon {
    font-size: 2rem;
    color: var(--accent);
  }
  .img-upload-area p {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 6px;
  }
  .img-preview {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    margin-top: 10px;
    display: none;
  }
  .img-preview.show { display: block; }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  .btn-save {
    flex: 1;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background 0.3s;
  }
  .btn-save:hover { background: #b88638; }
  .btn-cancel {
    flex: 1;
    background: transparent;
    color: var(--text-light);
    border: 1.5px solid var(--accent-light);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.3s;
  }
  .btn-cancel:hover {
    border-color: var(--text-light);
    color: var(--text);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    header h1 { font-size: 1.8rem; }
    .cards-grid { grid-template-columns: 1fr; }
    .modal { padding: 24px 20px; }
  }

  /* 打印优化 */
  @media print {
    .add-bar, .modal-overlay, .card-delete { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>📖 阅读<span>拾遗</span></h1>
  <p>记录那些在字里行间遇见的光 ✨</p>
</header>

<div class="add-bar">
  <button class="btn-add" onclick="openModal()">✒️ 添加摘录</button>
</div>

<div class="cards-wrap">
  <div id="emptyState" class="empty-state">
    <div class="icon">📚</div>
    <p>还没有摘录，点击上方按钮开始记录吧</p>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>添加摘录</h2>

    <label>📷 摘录图片</label>
    <div class="img-upload-area" onclick="document.getElementById('imgInput').click()">
      <div class="upload-icon">📁</div>
      <p>点击选择图片（支持 JPG / PNG）</p>
    </div>
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImgSelect(event)">
    <img class="img-preview" id="imgPreview">

    <label>💬 摘录的句子</label>
    <textarea class="quote-input" id="quoteInput" placeholder="写下你在阅读中遇到的好句子..."></textarea>

    <label>✍️ 我的感悟</label>
    <textarea class="thoughts-input" id="thoughtsInput" placeholder="写下你的感受和想法..."></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 数据存储（localStorage）=====
const STORAGE_KEY = 'reading_notes_data';
let currentImg = null;
let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

// ===== 渲染 =====
function render() {
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');

  if (entries.length === 0) {
    empty.style.display = 'block';
    grid.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = entries.map((e, i) => `
    <div class="card">
      <button class="card-delete" onclick="deleteEntry(${i})">✕</button>
      ${e.image
        ? `<div class="card-img-wrap"><img src="${e.image}" alt="摘录图片"></div>`
        : `<div class="card-img-wrap"><div class="img-placeholder">📖</div></div>`
      }
      <div class="card-quote">
        <p><span class="quote-mark">"</span>${escapeHtml(e.quote || '')}<span class="quote-mark">"</span></p>
      </div>
      <div class="card-thoughts">
        <label>✍️ 感悟</label>
        <div class="lines">
          <div class="thoughts-text">${escapeHtml(e.thoughts || '') || '<span style="color:#ccc;">还没有写感悟...</span>'}</div>
        </div>
      </div>
      <div class="card-date">${e.date || ''}</div>
    </div>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== 弹窗 =====
function openModal() {
  document.getElementById('modalOverlay').classList.add('active');
  currentImg = null;
  document.getElementById('imgInput').value = '';
  document.getElementById('imgPreview').classList.remove('show');
  document.getElementById('imgPreview').src = '';
  document.getElementById('quoteInput').value = '';
  document.getElementById('thoughtsInput').value = '';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== 图片选择 =====
function handleImgSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    currentImg = ev.target.result;

    // 压缩图片（如果太大）
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 1200;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      currentImg = canvas.toDataURL('image/jpeg', 0.85);

      const preview = document.getElementById('imgPreview');
      preview.src = currentImg;
      preview.classList.add('show');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== 保存 =====
function saveEntry() {
  const quote = document.getElementById('quoteInput').value.trim();
  const thoughts = document.getElementById('thoughtsInput').value.trim();

  if (!quote && !thoughts && !currentImg) {
    alert('至少写点什么吧 ✨');
    return;
  }

  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

  entries.unshift({
    image: currentImg,
    quote: quote,
    thoughts: thoughts,
    date: dateStr
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  closeModal();
  render();
}

// ===== 删除 =====
function deleteEntry(index) {
  if (!confirm('确定要删除这条摘录吗？')) return;
  entries.splice(index, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  render();
}

// ===== 导出功能（双击标题区触发）=====
let exportClickCount = 0;
document.querySelector('header').addEventListener('dblclick', function() {
  exportClickCount++;
  if (exportClickCount >= 2) {
    exportData();
    exportClickCount = 0;
  }
});

function exportData() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '阅读摘录_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  alert('数据已导出！');
}

// 初始渲染
render();
</script>
</body>
</html>
