<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
<meta name="theme-color" content="#fafaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miracle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Miracle</title>
<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --text: #4a4a4a;
  --text-mid: #888;
  --text-light: #bbb;
  --line: #f0f0f0;
  --accent: #7ea8a2;
  --glass: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.8);
  --shadow: 0 1px 6px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 16px rgba(0,0,0,0.06);
  --serif: 'Georgia','Songti SC','STSong',serif;
  --sans: -apple-system,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  --safe-bottom: env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  background:#ffffff;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
  position:fixed;width:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font-family:inherit;}

/* ===== App 容器 ===== */
#app{height:100%;display:flex;flex-direction:column;position:relative;}

/* 页面容器 */
.page{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:none;
  padding-bottom:100px;
}
.page.active{display:block;}

/* ===== 顶部标题 ===== */
.app-header{
  text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 44px) 20px 12px;
}
.app-header h1{
  font-family:var(--serif);
  font-size:1.5rem;
  font-weight:400;
  letter-spacing:4px;
  color:var(--text);
}
.app-header .sub{
  font-size:0.7rem;
  color:var(--text-light);
  letter-spacing:3px;
  margin-top:4px;
}

/* ===== 书列表（主页）===== */
.book-list{
  max-width:680px;
  margin:0 auto;
  padding:12px 16px;
}
.book-row{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
}
.book-row:active{transform:scale(0.98);box-shadow:var(--shadow-md);}
.book-row .cover{
  width:54px;height:72px;
  border-radius:4px 8px 8px 4px;
  object-fit:cover;
  flex-shrink:0;
  box-shadow:0 1px 6px rgba(0,0,0,0.12), inset 3px 0 0 rgba(0,0,0,0.06);
}
.book-row .cover-ph{
  width:54px;height:72px;
  border-radius:4px 8px 8px 4px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:0.6rem;
  color:rgba(255,255,255,0.85);
  text-align:center;padding:4px;
  word-break:break-all;
  box-shadow:0 1px 6px rgba(0,0,0,0.12), inset 3px 0 0 rgba(0,0,0,0.06);
}
.book-row .info{flex:1;min-width:0;}
.book-row .b-title{
  font-size:0.92rem;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.book-row .b-meta{
  font-size:0.72rem;color:var(--text-mid);margin-top:3px;
}
.book-row .b-tags{
  display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;
}
.book-row .tag{
  font-size:0.65rem;color:var(--text-light);
  background:var(--line);border-radius:8px;padding:2px 8px;
}
.book-row .arrow{
  color:var(--text-light);font-size:1.1rem;flex-shrink:0;
}

/* ===== 统计页 ===== */
.stats-wrap{
  max-width:680px;margin:0 auto;padding:20px 16px;
}
.stat-overview{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;
}
.stat-box{
  background:var(--card);border-radius:14px;padding:20px;text-align:center;
  box-shadow:var(--shadow);
}
.stat-box .num{
  font-family:var(--serif);font-size:1.8rem;font-weight:400;color:var(--text);
}
.stat-box .lbl{
  font-size:0.72rem;color:var(--text-light);letter-spacing:1px;margin-top:4px;
}
.genre-chart{
  background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--shadow);
}
.genre-chart h3{
  font-size:0.85rem;font-weight:500;margin-bottom:14px;letter-spacing:1px;
}
.genre-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.genre-bar .gname{
  font-size:0.78rem;width:70px;flex-shrink:0;color:var(--text-mid);
}
.genre-bar .gtrack{
  flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;
}
.genre-bar .gfill{
  height:100%;border-radius:4px;transition:width 0.5s;
}
.genre-bar .gcount{
  font-size:0.72rem;color:var(--text-light);width:30px;text-align:right;
}

/* 饼图 */
.pie-wrap{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:10px;}
.pie-chart{position:relative;width:140px;height:140px;border-radius:50%;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);}
.pie-legend{display:flex;flex-direction:column;gap:6px;}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text-mid);}
.pie-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* 柱状图 */
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:140px;padding:0 8px;margin-top:12px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.bar-col .bar{width:100%;max-width:32px;border-radius:6px 6px 0 0;transition:height 0.6s ease;min-height:4px;position:relative;}
.bar-col .bar-count{font-size:0.62rem;color:var(--text-light);}
.bar-col .bar-label{font-size:0.6rem;color:var(--text-mid);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;margin-top:2px;max-height:50px;overflow:hidden;}

/* 月度趋势 */
.trend-chart{background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:16px;}
.trend-chart h3{font-size:0.85rem;font-weight:500;margin-bottom:14px;letter-spacing:1px;}
.trend-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:100px;}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.trend-col .tbar{width:100%;max-width:20px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px;transition:height 0.6s;opacity:0.7;}
.trend-col .tbar.active{opacity:1;}
.trend-col .tmon{font-size:0.55rem;color:var(--text-light);}

/* ===== 书内详情页 ===== */
.book-detail-header{
  display:flex;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 44px) 16px 12px;
}
.book-detail-header .back{
  font-size:1.3rem;color:var(--text-mid);padding:4px 8px;
}
.book-detail-header .title{
  flex:1;text-align:center;font-family:var(--serif);
  font-size:1.05rem;font-weight:400;letter-spacing:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-right:34px;
}

.add-note-btn-wrap{text-align:center;padding:4px 20px 16px;}
.btn-add-note{
  background:var(--accent);color:#fff;
  padding:9px 26px;border-radius:22px;
  font-size:0.82rem;letter-spacing:2px;
}

/* 笔记网格（备忘录风格小框）*/
.notes-grid{
  max-width:680px;margin:0 auto;
  padding:4px 12px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.note-mini{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
}
.note-mini:active{transform:scale(0.97);}
.note-mini .nm-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
}
.note-mini .nm-img-placeholder{
  width:100%;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:0.82rem;color:var(--text-light);
  background:linear-gradient(135deg,#f5f5f3,#ede9e3);
  padding:12px;text-align:center;
}
.note-mini .nm-body{padding:10px 12px;}
.note-mini .nm-quote{
  font-family:var(--serif);font-size:0.78rem;line-height:1.5;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.note-mini .nm-date{
  font-size:0.65rem;color:var(--text-light);margin-top:6px;letter-spacing:1px;
}

/* ===== 笔记详情（拍立得风格）===== */
.note-detail-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;padding:24px;
}
.note-detail-overlay.active{display:flex;}
.polaroid{
  background:#fff;border-radius:6px;
  padding:14px 14px 18px;
  max-width:380px;width:100%;
  box-shadow:0 8px 40px rgba(0,0,0,0.25);
  animation:pIn 0.35s ease;
  transform:rotate(-1.5deg);
}
@keyframes pIn{from{opacity:0;transform:scale(0.9) rotate(-3deg);}to{opacity:1;transform:scale(1) rotate(-1.5deg);}}
.polaroid img{
  width:100%;border-radius:3px;display:block;
  max-height:400px;object-fit:cover;
}
.polaroid .p-quote{
  font-family:var(--serif);font-size:0.9rem;line-height:1.7;
  color:var(--text);margin-top:12px;padding:0 4px;
}
.polaroid .p-thoughts-card{
  background:#f9f7f4;border-radius:10px;padding:12px 14px;margin-top:10px;
  border:1px dashed #e0dad0;
}
.polaroid .p-thoughts-card .label{
  font-size:0.68rem;color:var(--text-light);letter-spacing:1.5px;margin-bottom:6px;
}
.polaroid .p-thoughts-card .text{
  font-family:var(--serif);font-size:0.85rem;line-height:1.7;color:var(--text-mid);
  white-space:pre-wrap;word-break:break-word;
}
.polaroid .p-date{
  font-family:var(--serif);font-size:0.72rem;color:var(--text-light);
  text-align:center;margin-top:12px;letter-spacing:2px;
}
.polaroid .p-actions{
  display:flex;gap:10px;margin-top:14px;justify-content:center;
}
.polaroid .p-actions button{
  font-size:0.78rem;padding:6px 16px;border-radius:16px;
  letter-spacing:1px;
}
.polaroid .btn-del{color:#c08080;background:#f8f0f0;}
.polaroid .btn-close{color:var(--text-mid);background:var(--line);}

/* ===== 底部程序坞 ===== */
.dock{
  position:fixed;
  bottom:calc(var(--safe-bottom) + 12px);
  left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  border:1px solid var(--glass-border);
  border-radius:28px;
  padding:8px 10px;
  box-shadow:0 4px 24px rgba(0,0,0,0.08), inset 0 1px 1px rgba(255,255,255,0.6);
  z-index:100;
}
.dock-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 18px;border-radius:20px;
  transition:background 0.25s,transform 0.25s;
  position:relative;
}
.dock-item:active{transform:scale(0.92);}
.dock-item.active{background:rgba(255,255,255,0.5);}
.dock-icon{font-size:1.3rem;line-height:1;}
.dock-label{font-size:0.6rem;color:var(--text-mid);letter-spacing:1px;}

/* ===== 弹窗 ===== */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:800;
  background:rgba(90,90,90,0.3);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--card);border-radius:16px;
  padding:28px 22px;width:100%;max-width:440px;
  max-height:85vh;overflow-y:auto;
  animation:mIn 0.3s ease;
}
@keyframes mIn{from{opacity:0;transform:scale(0.96) translateY(6px);}to{opacity:1;transform:none;}}
.modal h2{
  font-family:var(--serif);font-size:1.1rem;font-weight:400;
  text-align:center;letter-spacing:2px;margin-bottom:18px;
}
.modal label{
  display:block;font-size:0.76rem;color:var(--text-mid);
  margin:14px 0 6px;letter-spacing:1px;
}
.modal input[type="text"],.modal textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-size:0.86rem;color:var(--text);background:#fafafa;
}
.modal input[type="text"]:focus,.modal textarea:focus{
  outline:none;border-color:var(--accent);background:#fff;
}
.modal textarea{resize:vertical;}
.modal textarea.quote-input{min-height:64px;font-family:var(--serif);line-height:1.7;}
.modal textarea.thoughts-input{
  min-height:80px;font-family:var(--serif);line-height:28px;
  background-image:repeating-linear-gradient(transparent,transparent 27px,var(--line) 27px,var(--line) 28px);
  background-attachment:local;
}

/* 颜色选择 */
.color-grid{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;
}
.color-opt{
  width:30px;height:30px;border-radius:50%;
  border:2.5px solid transparent;cursor:pointer;transition:border-color 0.2s;
}
.color-opt.selected{border-color:var(--text);}
.color-custom-wrap{
  width:30px;height:30px;border-radius:50%;
  border:2px dashed var(--text-light);display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;overflow:hidden;
}
.color-custom-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.color-custom-wrap .plus{font-size:0.8rem;color:var(--text-light);}

/* 图片上传 */
.img-upload{
  border:1.5px dashed var(--line);border-radius:8px;padding:16px;
  text-align:center;cursor:pointer;transition:border-color 0.2s,background 0.2s;
}
.img-upload:hover{border-color:var(--accent);background:rgba(126,168,162,0.03);}
.img-upload .icon{font-size:1.4rem;color:var(--accent);}
.img-upload p{font-size:0.74rem;color:var(--text-mid);margin-top:3px;}
.img-preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:8px;display:none;}
.img-preview.show{display:block;}

.modal-actions{display:flex;gap:10px;margin-top:22px;}
.btn-save{flex:1;background:var(--accent);color:#fff;padding:11px;border-radius:8px;font-size:0.85rem;letter-spacing:1px;}
.btn-save:hover{filter:brightness(0.95);}
.btn-cancel{flex:1;background:none;color:var(--text-mid);border:1px solid var(--line);padding:11px;border-radius:8px;font-size:0.85rem;}

/* 空状态 */
.empty{text-align:center;padding:80px 20px;color:var(--text-light);}
.empty .icon{font-size:2.5rem;margin-bottom:10px;}
.empty p{font-size:0.82rem;letter-spacing:1px;}

/* 响应式 */
@media(max-width:380px){
  .notes-grid{gap:10px;}
  .book-row .cover,.book-row .cover-ph{width:48px;height:64px;}
}

@media print{.dock,.modal-overlay,.note-detail-overlay{display:none!important;}}
</style>
</head>
<body>
<div id="app">

<!-- ===== 主页 ===== -->
<div class="page active" id="pageHome">
  <div class="app-header">
    <h1>Miracle</h1>
    <div class="sub">R E A D I N G &nbsp; J O U R N A L</div>
  </div>
  <div style="text-align:center;padding:8px 20px 16px;">
    <button class="btn-add-note" onclick="openBookModal()" style="background:var(--accent);color:#fff;padding:9px 26px;border-radius:22px;font-size:0.82rem;letter-spacing:2px;border:none;cursor:pointer;">+ 添加书</button>
  </div>
  <div class="book-list" id="bookList"></div>
  <div id="emptyHome" class="empty" style="display:none;">
    <div class="icon">📚</div>
    <p>书架空空的，添加一本开始吧</p>
  </div>
</div>

<!-- ===== 统计页 ===== -->
<div class="page" id="pageStats">
  <div class="app-header">
    <h1>统计</h1>
    <div class="sub">S T A T I S T I C S</div>
  </div>
  <div class="stats-wrap" id="statsWrap"></div>
</div>

<!-- ===== 书详情页 ===== -->
<div class="page" id="pageBook">
  <div class="book-detail-header">
    <button class="back" onclick="goHome()">‹</button>
    <div class="title" id="bookTitle"></div>
  </div>
  <div class="add-note-btn-wrap">
    <button class="btn-add-note" onclick="openNoteModal()">+ 添加摘录</button>
  </div>
  <div id="emptyNotes" class="empty" style="display:none;">
    <div class="icon">📖</div>
    <p>还没有摘录，开始记录吧</p>
  </div>
  <div class="notes-grid" id="notesGrid"></div>
</div>

</div><!-- /app -->

<!-- ===== 底部程序坞 ===== -->
<div class="dock" id="dock">
  <div class="dock-item active" onclick="switchTab('home')" id="dockHome">
    <div class="dock-icon">🏡</div>
    <div class="dock-label">主页</div>
  </div>
  <div class="dock-item" onclick="switchTab('stats')" id="dockStats">
    <div class="dock-icon">📊</div>
    <div class="dock-label">统计</div>
  </div>
</div>

<!-- ===== 添加书 弹窗 ===== -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h2>添加书</h2>
    <label>书名</label>
    <input type="text" id="inputTitle" placeholder="书名">
    <label>作者</label>
    <input type="text" id="inputAuthor" placeholder="作者（可选）">
    <label>标签（逗号分隔）</label>
    <input type="text" id="inputTags" placeholder="如：小说, 青春, 成长">
    <label>封面颜色</label>
    <div class="color-grid" id="colorGrid">
      <div class="color-opt selected" style="background:#7ea8a2" data-c="#7ea8a2"></div>
      <div class="color-opt" style="background:#d4b896" data-c="#d4b896"></div>
      <div class="color-opt" style="background:#b0a0b8" data-c="#b0a0b8"></div>
      <div class="color-opt" style="background:#a0b8c0" data-c="#a0b8c0"></div>
      <div class="color-opt" style="background:#c0a8a0" data-c="#c0a8a0"></div>
      <div class="color-opt" style="background:#9eb5c4" data-c="#9eb5c4"></div>
      <div class="color-opt" style="background:#e8c4c4" data-c="#e8c4c4"></div>
      <div class="color-opt" style="background:#c4d4a8" data-c="#c4d4a8"></div>
      <div class="color-opt" style="background:#1a1a1a" data-c="#1a1a1a"></div>
      <div class="color-opt" style="background:#e8645a" data-c="#e8645a"></div>
      <div class="color-opt" style="background:#5a8ae8" data-c="#5a8ae8"></div>
      <div class="color-opt" style="background:#f0c030" data-c="#f0c030"></div>
      <label class="color-custom-wrap"><span class="plus">+</span><input type="color" id="customColor" value="#888888"></label>
    </div>
    <label>封面图片（可选）</label>
    <div class="img-upload" onclick="document.getElementById('coverInput').click()">
      <div class="icon">📁</div><p>点击选择封面</p>
    </div>
    <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCover(event)">
    <img class="img-preview" id="coverPrev">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('bookModal')">取消</button>
      <button class="btn-save" onclick="saveBook()">保存</button>
    </div>
  </div>
</div>

<!-- ===== 添加笔记 弹窗 ===== -->
<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <h2>添加摘录</h2>
    <label>摘录图片</label>
    <div class="img-upload" onclick="document.getElementById('noteImgInput').click()">
      <div class="icon">📁</div><p>点击选择图片</p>
    </div>
    <input type="file" id="noteImgInput" accept="image/*" style="display:none" onchange="handleNoteImg(event)">
    <img class="img-preview" id="noteImgPrev">
    <label>摘录的句子</label>
    <textarea class="quote-input" id="inputQuote" placeholder="好句子..."></textarea>
    <label>感悟</label>
    <textarea class="thoughts-input" id="inputThoughts" placeholder="你的想法..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('noteModal')">取消</button>
      <button class="btn-save" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<!-- ===== 笔记详情（拍立得）===== -->
<div class="note-detail-overlay" id="noteDetail">
  <div class="polaroid" id="polaroidCard"></div>
</div>

<script>
// ===== 数据 =====
const KEY='mir***';
let data=JSON.parse(localStorage.getItem(KEY)||'{"books":[],"currentBook":null}');
let currentBookId=null;
let selColor='#7ea8a2';
let coverImg=null;
let noteImg=null;
const genres=['小说','青春','成长','悬疑','奇幻','散文','历史','科学','心理','传记','诗歌','其他'];

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function fmtDate(d){
  const dt=new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

// 简易类型识别
function guessGenre(tags,title){
  const t=(tags||[]).join('')+title;
  const rules=[
    [['悬疑','推理','犯罪','侦探','thriller','mystery'],'悬疑'],
    [['奇幻','魔幻','科幻','fantasy','sci-fi','magic'],'奇幻'],
    [['青春','校园','成长','青春文学'],'青春'],
    [['散文','随笔','essay'],'散文'],
    [['历史','history'],'历史'],
    [['科学','科普','science'],'科学'],
    [['心理','psychology'],'心理'],
    [['传记','回忆录','biography'],'传记'],
    [['诗歌','诗','poetry'],'诗歌'],
    [['女性','言情','爱情','romance'],'小说'],
    [['小说','fiction','novel'],'小说'],
  ];
  const tl=t.toLowerCase();
  for(const[kw,g]of rules){if(kw.some(w=>tl.includes(w)))return g;}
  return '其他';
}

function getBookGenres(){
  const c={};
  data.books.forEach(b=>{
    const g=b.genre||guessGenre(b.tags||[],b.title);
    c[g]=(c[g]||0)+1;
  });
  return c;
}

// ===== Tab 切换 =====
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.dock-item').forEach(d=>d.classList.remove('active'));
  if(tab==='home'){
    document.getElementById('pageHome').classList.add('active');
    document.getElementById('dockHome').classList.add('active');
    renderHome();
  }else if(tab==='stats'){
    document.getElementById('pageStats').classList.add('active');
    document.getElementById('dockStats').classList.add('active');
    renderStats();
  }
  // 隐藏书详情页
  document.getElementById('pageBook').classList.remove('active');
}

function goHome(){
  switchTab('home');
}

// ===== 主页渲染 =====
function renderHome(){
  const list=document.getElementById('bookList');
  const empty=document.getElementById('emptyHome');
  if(data.books.length===0){empty.style.display='block';list.innerHTML='';return;}
  empty.style.display='none';
  list.innerHTML=data.books.map(b=>{
    const tags=(b.tags||[]).slice(0,3);
    return `
    <div class="book-row" onclick="openBook('${b.id}')">
      ${b.coverImg
        ?`<img class="cover" src="${b.coverImg}" style="border-radius:4px 8px 8px 4px;">`
        :`<div class="cover-ph" style="background:${b.color||'#7ea8a2'}">${esc(b.title)}</div>`
      }
      <div class="info">
        <div class="b-title">《${esc(b.title)}》</div>
        <div class="b-meta">${(b.notes||[]).length} 条笔记${b.author?' · '+esc(b.author):''}</div>
        ${tags.length?`<div class="b-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      </div>
      <div class="arrow">›</div>
    </div>`;
  }).join('');
}

// ===== 统计渲染 =====
function renderStats(){
  const wrap=document.getElementById('statsWrap');
  const totalBooks=data.books.length;
  const totalNotes=data.books.reduce((s,b)=>s+(b.notes||[]).length,0);
  const totalImg=data.books.reduce((s,b)=>s+(b.notes||[]).filter(n=>n.image).length,0);
  const genres=getBookGenres();
  const sorted=Object.entries(genres).sort((a,b)=>b[1]-a[1]);
  const maxCount=Math.max(...sorted.map(x=>x[1]),1);
  const palette=['#7ea8a2','#d4b896','#b0a0b8','#a0b8c0','#c0a8a0','#9eb5c4','#e8c4c4','#c4d4a8','#e8a05a','#a8c4d4','#d4a8c4','#bbbbbb'];

  // 饼图数据准备
  const pieData=sorted.map(([g,c],i)=>({name:g,value:c,color:palette[i%palette.length]}));
  const pieTotal=pieData.reduce((s,d)=>s+d.value,0);

  // SVG 饼图
  let acc=0;
  const cx=70,cy=70,r=60;
  const slices=pieData.map(d=>{
    const startAngle=(acc/pieTotal)*Math.PI*2-Math.PI/2;
    acc+=d.value;
    const endAngle=(acc/pieTotal)*Math.PI*2-Math.PI/2;
    const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    const largeArc=(endAngle-startAngle)>Math.PI?1:0;
    const path=`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z`;
    return `<path d="${path}" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  // 柱状图（每本书的笔记数）
  const bookStats=data.books.map(b=>({title:b.title,count:(b.notes||[]).length,color:b.color||'#7ea8a2'})).sort((a,b)=>b.count-a.count).slice(0,8);
  const maxBar=Math.max(...bookStats.map(b=>b.count),1);

  // 月度趋势
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const dt=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:dt.getFullYear()+'-'+dt.getMonth(),label:(dt.getMonth()+1)+'月'});
  }
  const monthCounts=months.map(m=>{
    let c=0;
    data.books.forEach(b=>(b.notes||[]).forEach(n=>{
      const nd=new Date(n.date);
      if(nd.getFullYear()+'-'+nd.getMonth()===m.key)c++;
    }));
    return c;
  });
  const maxMonth=Math.max(...monthCounts,1);

  wrap.innerHTML=`
    <div class="stat-overview">
      <div class="stat-box"><div class="num">${totalBooks}</div><div class="lbl">读过 / 本</div></div>
      <div class="stat-box"><div class="num">${totalNotes}</div><div class="lbl">摘录 / 条</div></div>
      <div class="stat-box"><div class="num">${totalImg}</div><div class="lbl">图片 / 张</div></div>
      <div class="stat-box"><div class="num">${sorted.length}</div><div class="lbl">类型 / 种</div></div>
    </div>

    <div class="genre-chart">
      <h3>🥧 类型占比（饼图）</h3>
      ${pieData.length?`
        <div class="pie-wrap">
          <svg class="pie-chart" viewBox="0 0 140 140" style="width:140px;height:140px;">${slices}<circle cx="70" cy="70" r="28" fill="#fff"/><text x="70" y="68" text-anchor="middle" font-size="11" fill="#888" font-family="Georgia">${pieTotal}</text><text x="70" y="80" text-anchor="middle" font-size="7" fill="#bbb" letter-spacing="1">BOOKS</text></svg>
          <div class="pie-legend">
            ${pieData.map(d=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${d.color}"></div>${d.name} ${d.value}本 (${Math.round(d.value/pieTotal*100)}%)</div>`).join('')}
          </div>
        </div>
      `:'<div class="empty" style="padding:20px;"><p>暂无数据</p></div>'}
    </div>

    <div class="genre-chart" style="margin-top:16px;">
      <h3>📊 类型分布（条形图）</h3>
      ${sorted.map(([g,c],i)=>`
        <div class="genre-bar">
          <div class="gname">${g}</div>
          <div class="gtrack"><div class="gfill" style="width:${c/maxCount*100}%;background:${palette[i%palette.length]}"></div></div>
          <div class="gcount">${c}</div>
        </div>
      `).join('')}
    </div>

    <div class="genre-chart" style="margin-top:16px;">
      <h3>📖 各书摘录数（柱状图）</h3>
      ${bookStats.length?`
        <div class="bar-chart">
          ${bookStats.map(b=>`
            <div class="bar-col">
              <div class="bar-count">${b.count}</div>
              <div class="bar" style="height:${b.count/maxBar*90}px;background:${b.color};"></div>
              <div class="bar-label">${esc(b.title.length>4?b.title.slice(0,4):b.title)}</div>
            </div>
          `).join('')}
        </div>
      `:'<div class="empty" style="padding:20px;"><p>暂无数据</p></div>'}
    </div>

    <div class="trend-chart">
      <h3>📅 近 6 个月摘录趋势</h3>
      <div class="trend-bars">
        ${months.map((m,i)=>`
          <div class="trend-col">
            <div class="tbar ${monthCounts[i]>0?'active':''}" style="height:${monthCounts[i]/maxMonth*80}px;"></div>
            <div class="tmon">${m.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${totalBooks===0?'<div class="empty" style="padding:40px;"><div class="icon">📊</div><p>还没有数据</p></div>':''}
  `;
}

// ===== 打开书 =====
function openBook(id){
  currentBookId=id;
  const b=data.books.find(x=>x.id===id);
  if(!b)return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pageBook').classList.add('active');
  document.getElementById('bookTitle').textContent=b.title;
  renderNotes(b);
  window.scrollTo(0,0);
}

function renderNotes(b){
  const grid=document.getElementById('notesGrid');
  const empty=document.getElementById('emptyNotes');
  const notes=b.notes||[];
  if(notes.length===0){empty.style.display='block';grid.innerHTML='';return;}
  empty.style.display='none';
  grid.innerHTML=notes.map((n,i)=>`
    <div class="note-mini" onclick="showNoteDetail('${b.id}',${i})">
      ${n.image
        ?`<img class="nm-img" src="${n.image}">`
        :`<div class="nm-img-placeholder">${esc((n.quote||'...').slice(0,20))}</div>`
      }
      <div class="nm-body">
        <div class="nm-quote">${esc(n.quote||'')}</div>
        <div class="nm-date">${fmtDate(n.date)}</div>
      </div>
    </div>
  `).join('');
}

// ===== 笔记详情（拍立得）=====
function showNoteDetail(bookId,idx){
  const b=data.books.find(x=>x.id===bookId);
  if(!b||!b.notes[idx])return;
  const n=b.notes[idx];
  const card=document.getElementById('polaroidCard');
  card.innerHTML=`
    ${n.image?`<img src="${n.image}">`:''}
    ${n.quote?`<div class="p-quote">"${esc(n.quote)}"</div>`:''}
    ${n.thoughts?`
      <div class="p-thoughts-card">
        <div class="label">✍ 感悟</div>
        <div class="text">${esc(n.thoughts)}</div>
      </div>`:''
    }
    <div class="p-date">${fmtDate(n.date)}</div>
    <div class="p-actions">
      <button class="btn-del" onclick="delNote('${bookId}',${idx})">删除</button>
      <button class="btn-close" onclick="closeNoteDetail()">关闭</button>
    </div>
  `;
  document.getElementById('noteDetail').classList.add('active');
}
function closeNoteDetail(){document.getElementById('noteDetail').classList.remove('active');}
document.getElementById('noteDetail').addEventListener('click',function(e){if(e.target===this)closeNoteDetail();});

function delNote(bookId,idx){
  if(!confirm('删除这条摘录？'))return;
  const b=data.books.find(x=>x.id===bookId);
  if(!b)return;
  b.notes.splice(idx,1);save();closeNoteDetail();renderNotes(b);renderHome();
}

// ===== 添加书 =====
document.querySelectorAll('.color-opt[data-c]').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');selColor=el.dataset.c;
  });
});
document.getElementById('customColor').addEventListener('input',function(){
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  selColor=this.value;
  // 把自定义色显示到 + 号圆
  this.parentElement.style.background=this.value;
  this.parentElement.style.borderStyle='solid';
  this.parentElement.querySelector('.plus').style.color='#fff';
});

function handleCover(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;const mx=500;
      if(w>mx){h=h*mx/w;w=mx;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      coverImg=c.toDataURL('image/jpeg',0.85);
      const p=document.getElementById('coverPrev');p.src=coverImg;p.classList.add('show');
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function saveBook(){
  const title=document.getElementById('inputTitle').value.trim();
  if(!title){alert('请输入书名');return;}
  const author=document.getElementById('inputAuthor').value.trim();
  const tagsStr=document.getElementById('inputTags').value.trim();
  const tags=tagsStr?tagsStr.split(/[,，、]/).map(t=>t.trim()).filter(Boolean):[];
  const book={
    id:'b_'+Date.now(),
    title,author,tags,
    color:selColor,coverImg,
    genre:guessGenre(tags,title),
    notes:[]
  };
  data.books.unshift(book);save();closeModal('bookModal');renderHome();
}

// ===== 添加笔记 =====
function handleNoteImg(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;const mx=1200;
      if(w>mx){h=h*mx/w;w=mx;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      noteImg=c.toDataURL('image/jpeg',0.85);
      const p=document.getElementById('noteImgPrev');p.src=noteImg;p.classList.add('show');
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function saveNote(){
  const quote=document.getElementById('inputQuote').value.trim();
  const thoughts=document.getElementById('inputThoughts').value.trim();
  if(!quote&&!thoughts&&!noteImg){alert('至少写点什么');return;}
  const b=data.books.find(x=>x.id===currentBookId);
  if(!b)return;
  b.notes=b.notes||[];
  b.notes.unshift({image:noteImg,quote,thoughts,date:new Date().toISOString()});
  save();closeModal('noteModal');renderNotes(b);renderHome();
}

// ===== 弹窗通用 =====
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active');});
});

// 主页点标题 3 次导出
let ec=0;
document.querySelector('#pageHome .app-header h1').addEventListener('click',()=>{
  ec++;if(ec>=3){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Miracle_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();ec=0;
  }
});

// ===== SW =====
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// 初始化
renderHome();
</script>
</body>
</html>
